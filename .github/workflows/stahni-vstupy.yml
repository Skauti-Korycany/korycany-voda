name: Stazeni vstupu ZABAGED a BPEJ

# Spusti se pushem do vetve "vstupy" (nebo rucne). Stazena data commitne zpet do vetve "vstupy",
# odkud si je vezme Claude; do main se surova data nedavaji.
on:
  push:
    branches: [vstupy]
    paths: [data/povodi.geojson, tools/stahni_vstupy.py]
  workflow_dispatch:

jobs:
  stahni:
    runs-on: ubuntu-latest
    permissions:
      contents: write
