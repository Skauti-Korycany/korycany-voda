name: Stazeni vstupu ZABAGED a BPEJ

# Spusti se pushem do vetve "vstupy" (nebo rucne). Stazena data commitne zpet do vetve "vstupy",
# odkud si je vezme Claude; do main se surova data nedavaji.
on:
  push:
    branches: [vstupy]
    paths: [data/povodi.geojson, tools/stahni_vstupy.py, .github/workflows/stahni-vstupy.yml]
  workflow_dispatch:

jobs:
  stahni:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pyproj rasterio matplotlib
      - run: mkdir -p vstupy && python tools/stahni_vstupy.py --out vstupy 2>&1 | tee vstupy/log.txt
      - name: Toky HY-NET (CUZK) pro nove uzemi
        run: |
          curl -sSL -o hynet.zip https://openzu.cuzk.gov.cz/opendata/HY-NET/HY-NET.zip
          mkdir -p data/HY-NET && unzip -q -o hynet.zip -d data/HY-NET
          python tools/03_vektory.py --budovy neexistuje.xml 2>&1 | tee -a vstupy/log.txt || true
          cp data/toky_cuzk.geojson vstupy/ || true
      - name: Katastr Mouchnice (CP INSPIRE) - cast nivy u jezu lezi v k.u. Mouchnice
        run: mkdir -p vstupy/cp && curl -sSL -o vstupy/cp/699969.zip https://services.cuzk.gov.cz/gml/inspire/cp/epsg-5514/699969.zip || true
      - name: Commit do vetve vstupy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f vstupy
          git commit -m "[bot] vstupy ZABAGED + BPEJ $(date -u +%Y-%m-%d)" || exit 0
          git pull --rebase -X theirs -q origin vstupy || true
          git push origin HEAD:vstupy
