name: Test site (jednorazove)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-sit.yml"

permissions:
  contents: write

jobs:
  vzorky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stazeni vzorku surovych dat
        run: |
          set +e
          V=data/pocasi/vzorek; mkdir -p $V
          UA="Mozilla/5.0 (korycany-voda; skautsky oddil Korycany)"
          M=$(date -u +%Y%m); P=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y%m)
          for W in 0-203-0-41701068002 0-203-0-41503035001; do
            for X in $M $P; do
              curl -sS -A "$UA" -o $V/dly-$W-$X.json -w "dly $W $X HTTP %{http_code}\n" \
                "https://opendata.chmi.cz/meteorology/climate/recent/data/daily/dly-$W-$X.json"
            done
          done
          curl -sS -A "$UA" -o $V/pmo_korycany.html -w "pmo HTTP %{http_code}\n" \
            "https://sap.pmo.cz/portal/Srazky/cz/pc/Mereni.aspx?id=60&oid=3"
          curl -sS -A "$UA" -o $V/nemotice.html -w "hladiny HTTP %{http_code}\n" \
            "https://www.hladiny.cz/hladiny/index.php?ca=196&cs=50089"
          ls -la $V
      - name: Zapis do repozitare
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pocasi
          git commit -m "[bot] vzorky surovych dat $(date -u +%Y-%m-%d)" || exit 0
          git pull --rebase -q origin main
          git push origin HEAD:main
