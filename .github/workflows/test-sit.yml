name: Test site (jednorazove)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-sit.yml"

permissions:
  contents: write

jobs:
  vzorky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Historicka rada Nemochovice
        run: |
          set +e
          V=data/pocasi/vzorek; mkdir -p $V
          UA="Mozilla/5.0 (korycany-voda; skautsky oddil Korycany)"
          B=https://opendata.chmi.cz/meteorology/climate/historical_csv
          W=0-203-0-41503035001
          curl -sS -A "$UA" -o $V/listing_daily.html -w "listing HTTP %{http_code}\n" "$B/data/daily/"
          curl -sS -A "$UA" -o $V/meta2.csv -w "meta2 HTTP %{http_code}\n" "$B/metadata/meta2.csv"
          curl -sS -A "$UA" -o $V/dly-0-203-0-41701068002-SRA.csv -w "Korycany SRA HTTP %{http_code}\n" "$B/data/daily/precipitation/dly-0-203-0-41701068002-SRA.csv"
          for E in T TMA TMI H F; do
            for D in temperature air_temperature humidity wind; do
              U="$B/data/daily/$D/dly-$W-$E.csv"
              C=$(curl -sS -A "$UA" -o $V/dly-$W-$E.csv -w "%{http_code}" "$U")
              echo "$E $D HTTP $C"
              [ "$C" = "200" ] && break
              rm -f $V/dly-$W-$E.csv
            done
          done
          for F in $V/dly-$W-*.csv; do echo "== $F"; head -3 "$F"; wc -l "$F"; done
          ls -la $V
      - name: Zapis do repozitare
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pocasi
          git commit -m "[bot] historicka rada Nemochovice $(date -u +%Y-%m-%d)" || exit 0
          git pull --rebase -q origin main
          git push origin HEAD:main
