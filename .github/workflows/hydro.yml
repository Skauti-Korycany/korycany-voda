name: Prameny a Kyjovka (CHMU hydrologie)

# Stahne merene rady CHMU: vydatnost pramenu u Korycan a stavy/prutoky Kyjovky. Vystup data/hydro/ ve vetvi, ze ktere bezel.
on:
  push:
    branches: ['claude/**']
    paths: [tools/15_pramen_kyjovka.py, .github/workflows/hydro.yml]
  workflow_dispatch:

jobs:
  hydro:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: mkdir -p data/hydro && python tools/15_pramen_kyjovka.py data/hydro 2>&1 | tee data/hydro/log.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/hydro
          git commit -m "[bot] hydro $(date -u +%Y-%m-%d)" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
